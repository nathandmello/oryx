name: PM Hub checks

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: hub-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tree: ${{ steps.candidate.outputs.tree }}
      native: ${{ steps.candidate.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/release_candidate.py >> "$GITHUB_OUTPUT"
      - name: Check Hub structure and published commands
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/pm.py check --system-only --command-base "$BASE_SHA"
      - run: python3 -m unittest discover -s tests -v
      - name: Exercise the browser app in Chromium
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Check context retrieval, artifact structure and numeric behavior
        run: python3 tests/context-evals/run.py --strict

  check:
    needs: tests
    if: ${{ always() && !cancelled() && !github.event.pull_request.draft }}
    runs-on: ${{ needs.tests.outputs.native == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Require successful Linux tests
        env:
          RESULT: ${{ needs.tests.result }}
        run: test "$RESULT" = success
      - if: needs.tests.outputs.native == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exercise native relocation, upgrade and restore
        if: needs.tests.outputs.native == 'true'
        env:
          PYTHONPATH: tests
        run: python3 -m unittest -v test_release.BackupTests test_repositories test_context_search
      - name: Tested tree ${{ needs.tests.outputs.tree }}
        run: 'true'
