name: oryx review evidence
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  checks: read
concurrency:
  group: hub-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/release_review.py
        env:
          ORYX_STUDY_REVIEWER_PUBLIC_KEY: ${{ vars.ORYX_STUDY_REVIEWER_PUBLIC_KEY }}
          ORYX_STUDY_PINS: ${{ vars.ORYX_STUDY_PINS }}
          GH_TOKEN: ${{ github.token }}
